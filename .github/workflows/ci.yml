name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Une seule execution par branche : un nouveau push annule la precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: matcha-app

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: matcha-app/package-lock.json

      # npm ci et pas npm install : installe exactement le lockfile et
      # echoue s'il est desynchronise de package.json.
      - name: Install
        run: npm ci

      # Le sujet exige zero erreur ET zero warning, cote serveur comme client.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
